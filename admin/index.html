<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <meta name="robots" content="noindex, nofollow">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THULIRVA Enterprise — Operations Administration Portal</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --brand-forest: #173F2D;
            --brand-forest-dark: #0F2D1E;
            --brand-cream: #FAF7F0;
            --brand-gold: #D4AF37;
            --brand-gold-dark: #B89228;
        }

        body {
            background-color: var(--brand-cream);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(23, 63, 45, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(23, 63, 45, 0.02) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow-x: hidden;
            color: #1F2937;
        }

        /* Subtle dairy / leaf background watermark ornaments */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(23, 63, 45, 0.04) 0%, transparent 70%);
            top: -120px;
            right: -100px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            pointer-events: none;
        }

        .login-card-enterprise {
            background: #FFFFFF;
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 44px 38px 36px;
            box-shadow: 0 16px 40px rgba(23, 63, 45, 0.09), 0 4px 12px rgba(212, 175, 55, 0.08);
            position: relative;
            z-index: 10;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo-wrap {
            position: relative;
            width: 78px;
            height: 78px;
            margin: 0 auto 16px;
        }

        .login-logo {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 3px solid #D4AF37;
            padding: 2px;
            background: #FFFFFF;
            box-shadow: 0 6px 18px rgba(23, 63, 45, 0.14);
            display: block;
            object-fit: cover;
        }

        .login-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--brand-forest);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            line-height: 1.1;
        }

        .login-subtitle {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brand-gold-dark);
        }

        .login-error {
            background: #FEF2F2;
            border: 1.5px solid #FCA5A5;
            color: #991B1B;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
            animation: fadeInDown 0.2s ease;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #374151;
            margin-bottom: 7px;
        }

        .input-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            color: #9CA3AF;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-control-enterprise {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #E5E7EB;
            border-radius: 10px;
            font-size: 13.5px;
            font-family: inherit;
            background: #FAF8F2;
            color: #111827;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control-enterprise:focus {
            background: #FFFFFF;
            border-color: var(--brand-forest);
            box-shadow: 0 0 0 3.5px rgba(23, 63, 45, 0.10);
        }

        .btn-toggle-pw {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #6B7280;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .btn-toggle-pw:hover {
            color: var(--brand-forest);
        }

        .form-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 12.5px;
        }

        .remember-checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #4B5563;
            user-select: none;
            font-weight: 500;
        }

        .remember-checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--brand-forest);
            cursor: pointer;
        }

        .btn-login-submit {
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(180deg, #173F2D 0%, #113123 100%);
            color: #FFFFFF;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(23, 63, 45, 0.22);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login-submit:hover:not(:disabled) {
            background: linear-gradient(180deg, #1E4F39 0%, #153A2A 100%);
            border-color: #D4AF37;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(23, 63, 45, 0.30);
        }

        .btn-login-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner-login {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            display: none;
        }

        .login-footer-trust {
            margin-top: 26px;
            text-align: center;
            border-top: 1px solid #F3EFE4;
            padding-top: 16px;
        }

        .trust-badge {
            font-size: 11px;
            font-weight: 600;
            color: #6B7280;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .trust-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1E6F43;
        }
    </style>
</head>

<body>

    <div class="login-card-enterprise">
        <div class="login-brand-header">
            <div class="login-logo-wrap">
                <img src="images/logo.jpg" alt="THULIRVA Official Crest" class="login-logo">
            </div>
            <h1 class="login-title">THULIRVA</h1>
            <div class="login-subtitle">Enterprise Administration</div>
        </div>

        <div class="login-error" id="loginError">
            <span style="font-size:16px;">⚠️</span>
            <span id="loginErrorText">Invalid credentials or unauthorized access.</span>
        </div>

        <form id="adminLoginForm" autocomplete="off" onsubmit="handleAdminLogin(event)" data-bitwarden-watching="false" data-lpignore="true">
            <!-- Hidden decoy fields to capture aggressive browser autofill -->
            <input type="text" name="decoy_username" id="decoy_username" tabindex="-1" aria-hidden="true" autocomplete="off" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;width:1px;height:1px;">
            <input type="password" name="decoy_password" id="decoy_password" tabindex="-1" aria-hidden="true" autocomplete="new-password" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;width:1px;height:1px;">

            <div class="form-group">
                <label class="form-label" for="email">Administrator Email</label>
                <div class="input-icon-wrap">
                    <span class="input-icon-left">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="email" id="email" name="admin_login_identity" class="form-control-enterprise" value=""
                        placeholder="admin@thulirva.com" required autocomplete="new-password"
                        autocorrect="off" autocapitalize="off" spellcheck="false"
                        data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other"
                        readonly onfocus="this.removeAttribute('readonly');" ontouchstart="this.removeAttribute('readonly');">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-icon-wrap">
                    <span class="input-icon-left">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="password" name="admin_login_secret" class="form-control-enterprise" style="padding-right: 44px;"
                        value="" placeholder="••••••••" required autocomplete="new-password"
                        autocorrect="off" autocapitalize="off" spellcheck="false"
                        data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other"
                        readonly onfocus="this.removeAttribute('readonly');" ontouchstart="this.removeAttribute('readonly');">
                    <button type="button" class="btn-toggle-pw" id="btnTogglePassword" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-options-row">
                <span class="security-indicator" style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#047857;font-weight:600;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>Secure Isolated Session</span>
                </span>
                <a href="javascript:void(0)" onclick="promptSupportHelp()" style="color:var(--brand-forest); font-weight:600; text-decoration:none;">Support Help</a>
            </div>

            <button type="submit" class="btn-login-submit" id="btnLoginSubmit">
                <span class="spinner-login" id="loginSpinner"></span>
                <span id="btnSubmitText">Sign In to Dashboard</span>
            </button>
        </form>

        <!-- TWO-STEP VERIFICATION (2FA) FORM -->
        <form id="admin2FAForm" autocomplete="off" onsubmit="handleVerify2FA(event)" style="display:none;">
            <div style="text-align:center; margin-bottom:20px;">
                <div style="width:52px; height:52px; border-radius:50%; background:rgba(23,63,45,0.08); border:2px solid #D4AF37; display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#173F2D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
                <h3 style="font-size:18px; font-weight:800; color:var(--brand-forest); margin:0 0 6px;">Two-Step Verification</h3>
                <p style="font-size:12.5px; color:#4B5563; line-height:1.5; margin:0;" id="twoFactorInstructions">
                    A 6-digit security code has been dispatched to <strong style="color:var(--brand-forest);" id="twoFactorRecipient">thulirvaofficial@gmail.com & admin@thulirva.com</strong>.
                </p>
            </div>

            <div class="form-group">
                <label class="form-label" for="twoFactorOtp" style="text-align:center;">Enter 6-Digit Code</label>
                <input type="text" id="twoFactorOtp" class="form-control-enterprise"
                    style="text-align:center; font-size:24px; font-weight:800; letter-spacing:10px; padding:12px; font-family:'Courier New', monospace; background:#FFFFFF;"
                    placeholder="••••••" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code">
            </div>

            <button type="submit" class="btn-login-submit" id="btnVerify2FASubmit" style="margin-top:12px;">
                <span class="spinner-login" id="verify2FASpinner"></span>
                <span id="btnVerify2FAText">Verify & Enter Console</span>
            </button>

            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:20px; font-size:12.5px;">
                <button type="button" id="btnResend2FA" onclick="handleResend2FA()" style="background:transparent; border:none; color:var(--brand-forest); font-weight:700; cursor:pointer; padding:0; text-decoration:underline;">
                    Resend Code
                </button>
                <button type="button" onclick="cancel2FAStep()" style="background:transparent; border:none; color:#6B7280; font-weight:600; cursor:pointer; padding:0;">
                    ← Back to Login
                </button>
            </div>
        </form>

        <div class="login-footer-trust">
            <div class="trust-badge">
                <span class="trust-badge-dot"></span>
                <span>Single Source of Truth • Padur Hub • Port 5500</span>
            </div>
        </div>
    </div>

    <script>
        function getApiBaseUrl() {
            if (window.THULIRVA_API_BASE) return window.THULIRVA_API_BASE.replace(/\/+$/, "");
            if (window.location && window.location.protocol === "file:") return "http://localhost:5500";
            if (window.location && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")) {
                if (window.location.port && window.location.port !== "5500" && window.location.port !== "80" && window.location.port !== "443") {
                    return "http://" + window.location.hostname + ":5500";
                }
            }
            return "";
        }

        // Verify admin token if already stored
        (async function checkExistingAdminSession() {
            const token = localStorage.getItem("thulirva_admin_token");
            if (token) {
                try {
                    const res = await fetch(getApiBaseUrl() + "/api/admin/profile", {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const role = (data.admin?.role || data.user?.role || "").toLowerCase();
                        if (role === "admin" || role === "super_admin" || role === "super admin") {
                            window.location.replace("dashboard.html");
                            return;
                        }
                    }
                } catch (_) {}
                // Token invalid, expired, or belongs to a customer
                localStorage.removeItem("thulirva_admin_token");
                localStorage.removeItem("thulirva_admin_user");
                localStorage.removeItem("admin");
            }
        })();

        // Aggressively eliminate browser and password manager autofill
        function enforceSecureBlankCredentials() {
            try {
                localStorage.removeItem("thulirva_remembered_email");
            } catch (_) {}

            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const decoyUser = document.getElementById("decoy_username");
            const decoyPass = document.getElementById("decoy_password");

            if (decoyUser) decoyUser.value = "";
            if (decoyPass) decoyPass.value = "";

            if (emailInput && document.activeElement !== emailInput) {
                emailInput.value = "";
                emailInput.setAttribute("readonly", "readonly");
                const unlockEmail = () => emailInput.removeAttribute("readonly");
                emailInput.addEventListener("focus", unlockEmail, { once: true });
                emailInput.addEventListener("click", unlockEmail, { once: true });
            }
            if (passwordInput && document.activeElement !== passwordInput) {
                passwordInput.value = "";
                passwordInput.setAttribute("readonly", "readonly");
                const unlockPass = () => passwordInput.removeAttribute("readonly");
                passwordInput.addEventListener("focus", unlockPass, { once: true });
                passwordInput.addEventListener("click", unlockPass, { once: true });
            }
        }

        // Multi-stage blank credential enforcement across all lifecycle hooks
        enforceSecureBlankCredentials();
        document.addEventListener("DOMContentLoaded", enforceSecureBlankCredentials);
        window.addEventListener("pageshow", enforceSecureBlankCredentials);
        window.addEventListener("load", enforceSecureBlankCredentials);
        setTimeout(enforceSecureBlankCredentials, 50);
        setTimeout(enforceSecureBlankCredentials, 150);
        setTimeout(enforceSecureBlankCredentials, 350);
        setTimeout(enforceSecureBlankCredentials, 750);

        // Toggle password show/hide
        function togglePasswordVisibility() {
            const pwInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            if (pwInput.type === "password") {
                pwInput.type = "text";
                eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`;
            } else {
                pwInput.type = "password";
                eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
            }
        }

        let activeTwoFactorToken = null;
        let resendTimerInterval = null;

        function promptSupportHelp() {
            alert("THULIRVA Operations & Security Support:\n\nFor enterprise administrative access inquiries or account unlock requests, please contact your System Administrator or IT Security Team at security@thulirva.com.");
        }

        function startResendCooldown(seconds = 30) {
            const btn = document.getElementById("btnResend2FA");
            if (!btn) return;
            let remaining = seconds;
            btn.disabled = true;
            btn.style.opacity = "0.6";
            btn.style.cursor = "not-allowed";
            btn.style.textDecoration = "none";
            btn.textContent = `Resend Code (${remaining}s)`;

            if (resendTimerInterval) clearInterval(resendTimerInterval);
            resendTimerInterval = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(resendTimerInterval);
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    btn.style.cursor = "pointer";
                    btn.style.textDecoration = "underline";
                    btn.textContent = "Resend Code";
                } else {
                    btn.textContent = `Resend Code (${remaining}s)`;
                }
            }, 1000);
        }

        function cancel2FAStep() {
            activeTwoFactorToken = null;
            if (resendTimerInterval) clearInterval(resendTimerInterval);
            document.getElementById("admin2FAForm").style.display = "none";
            document.getElementById("adminLoginForm").style.display = "block";
            document.getElementById("loginError").style.display = "none";
            const pw = document.getElementById("password");
            if (pw) pw.value = "";
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const email = (emailInput ? emailInput.value : "").trim();
            const password = passwordInput ? passwordInput.value : "";
            const errorEl = document.getElementById("loginError");
            const errorText = document.getElementById("loginErrorText");
            const btn = document.getElementById("btnLoginSubmit");
            const spinner = document.getElementById("loginSpinner");
            const btnText = document.getElementById("btnSubmitText");

            errorEl.style.display = "none";
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.textContent = "Authenticating...";

            try {
                localStorage.removeItem("thulirva_remembered_email");
            } catch (_) {}

            try {
                const response = await fetch(getApiBaseUrl() + "/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, admin_login: true, is_admin_portal: true })
                });
                const data = await response.json();

                // 2-STEP VERIFICATION TRIGGERED
                if (data.success && data.requires2FA && data.twoFactorToken) {
                    activeTwoFactorToken = data.twoFactorToken;
                    document.getElementById("adminLoginForm").style.display = "none";
                    document.getElementById("admin2FAForm").style.display = "block";
                    
                    const recipientEl = document.getElementById("twoFactorRecipient");
                    if (recipientEl) recipientEl.textContent = data.email || "admin@thulirva.com";
                    
                    const otpInput = document.getElementById("twoFactorOtp");
                    if (otpInput) {
                        otpInput.value = "";
                        setTimeout(() => otpInput.focus(), 100);
                    }
                    startResendCooldown(30);
                    return;
                }

                const role = (data.user?.role || data.admin?.role || "").toLowerCase();
                const isAdmin = role === "admin" || role === "super_admin" || role === "super admin";

                if (data.success && data.token && isAdmin) {
                    localStorage.setItem("thulirva_admin_token", data.token);
                    const adminUser = {
                        id: data.user?.id || 1,
                        name: data.user?.name || "Super Admin",
                        admin_name: data.user?.name || "Super Admin",
                        email: data.user?.email || email,
                        role: role === "super_admin" ? "Super Admin" : "Admin",
                        profile_photo: data.user?.profile_photo || ""
                    };
                    localStorage.setItem("thulirva_admin_user", JSON.stringify(adminUser));
                    localStorage.setItem("admin", JSON.stringify(adminUser));
                    window.location.replace("dashboard.html");
                } else {
                    localStorage.removeItem("thulirva_admin_token");
                    localStorage.removeItem("thulirva_admin_user");
                    localStorage.removeItem("admin");
                    if (passwordInput) passwordInput.value = "";
                    errorText.textContent = data.message || "Access Denied: Customer accounts are not authorized to sign in to the Administrative Portal.";
                    errorEl.style.display = "flex";
                }
            } catch (err) {
                errorText.textContent = "Unable to connect to backend server on port 5500. Please verify the service is running.";
                errorEl.style.display = "flex";
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.textContent = "Sign In to Dashboard";
            }
        }

        async function handleVerify2FA(event) {
            event.preventDefault();
            if (!activeTwoFactorToken) {
                cancel2FAStep();
                return;
            }

            const otpInput = document.getElementById("twoFactorOtp");
            const otp = (otpInput ? otpInput.value : "").trim();
            const errorEl = document.getElementById("loginError");
            const errorText = document.getElementById("loginErrorText");
            const btn = document.getElementById("btnVerify2FASubmit");
            const spinner = document.getElementById("verify2FASpinner");
            const btnText = document.getElementById("btnVerify2FAText");

            errorEl.style.display = "none";
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.textContent = "Verifying Code...";

            try {
                const response = await fetch(getApiBaseUrl() + "/api/auth/verify-2fa", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ twoFactorToken: activeTwoFactorToken, otp })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    localStorage.setItem("thulirva_admin_token", data.token);
                    const adminUser = {
                        id: data.admin?.id || data.user?.id || 1,
                        name: data.admin?.name || data.user?.name || "Super Admin",
                        admin_name: data.admin?.name || data.user?.name || "Super Admin",
                        email: data.admin?.email || data.user?.email || "admin@thulirva.com",
                        role: data.admin?.role || "Super Admin",
                        profile_photo: data.admin?.profile_photo || data.user?.profile_photo || ""
                    };
                    localStorage.setItem("thulirva_admin_user", JSON.stringify(adminUser));
                    localStorage.setItem("admin", JSON.stringify(adminUser));
                    window.location.replace("dashboard.html");
                } else {
                    errorText.textContent = data.message || "Invalid two-step verification code. Please check your inbox and try again.";
                    errorEl.style.display = "flex";
                    if (otpInput) {
                        otpInput.value = "";
                        otpInput.focus();
                    }
                }
            } catch (err) {
                errorText.textContent = "Server communication failure. Please verify the backend service is running.";
                errorEl.style.display = "flex";
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.textContent = "Verify & Enter Console";
            }
        }

        async function handleResend2FA() {
            if (!activeTwoFactorToken) return;
            const errorEl = document.getElementById("loginError");
            const errorText = document.getElementById("loginErrorText");

            try {
                const res = await fetch(getApiBaseUrl() + "/api/auth/resend-2fa", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ twoFactorToken: activeTwoFactorToken })
                });
                const data = await res.json();
                if (data.success) {
                    startResendCooldown(30);
                    alert("A fresh verification code has been dispatched to admin@thulirva.com.");
                } else {
                    errorText.textContent = data.message || "Failed to resend code.";
                    errorEl.style.display = "flex";
                }
            } catch (err) {
                errorText.textContent = "Unable to contact server to resend code.";
                errorEl.style.display = "flex";
            }
        }
    </script>

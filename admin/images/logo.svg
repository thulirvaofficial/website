<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B155" />
      <stop offset="50%" stop-color="#C5933A" />
      <stop offset="100%" stop-color="#8E6318" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#144C33" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(10, 5)">
    <!-- Gold Arc Ring -->
    <circle cx="45" cy="45" r="40" fill="none" stroke="url(#goldRing)" stroke-width="4" stroke-dasharray="190, 60" transform="rotate(-40 45 45)" />
    
    <!-- Curved Field Base -->
    <path d="M 22 72 Q 45 80 68 72 Q 45 86 22 72 Z" fill="#1B4D3E" />
    <path d="M 26 77 Q 45 84 64 77 Q 45 89 26 77 Z" fill="#2E7D32" opacity="0.8" />
    
    <!-- Serif Letter T -->
    <text x="45" y="65" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="#144C33" text-anchor="middle">T</text>
    
    <!-- Sprouting Leaves Branch emerging from T -->
    <path d="M 45 46 C 42 34 50 25 56 22 C 54 28 50 36 45 46 Z" fill="url(#leafGrad)" />
    <path d="M 52 38 C 58 32 66 33 70 38 C 64 41 57 40 52 38 Z" fill="url(#leafGrad)" />
    <path d="M 54 48 C 62 46 68 50 71 56 C 65 57 58 54 54 48 Z" fill="url(#leafGrad)" />
    <path d="M 52 58 C 59 60 63 66 63 72 C 58 70 54 65 52 58 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Vertical Divider -->
  <line x1="110" y1="20" x2="110" y2="80" stroke="#1B4D3E" stroke-width="2.5" opacity="0.85" />

  <!-- Brand Typography -->
  <g transform="translate(125, 0)">
    <text x="0" y="44" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="3" fill="#144C33">THULIRVA</text>
    <!-- Little leaf on letter V -->
    <path d="M 172 26 C 176 22 181 23 183 26 C 180 28 175 28 172 26 Z" fill="#2E7D32" />
    
    <!-- Subtitle with horizontal rules -->
    <line x1="2" y1="56" x2="30" y2="56" stroke="#C5933A" stroke-width="1.8" />
    <text x="38" y="59" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4" fill="#C5933A">ROOTED IN NATURE</text>
    <line x1="182" y1="56" x2="210" y2="56" stroke="#C5933A" stroke-width="1.8" />

    <!-- Tagline -->
    <text x="2" y="76" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#1B4D3E">AGRO &amp; DAIRY PRODUCTS.</text>
  </g>
</svg>
